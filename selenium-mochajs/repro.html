<!DOCTYPE html>
<html>
<head>
    <title>ChromeDriver clear() Bug Reproduction</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .input-container { margin-bottom: 10px; }
        #log {
            white-space: pre;
            font-family: monospace;
            border: 1px solid #ccc;
            background: #f9f9f9;
            padding: 10px;
            margin-top: 20px;
            height: 200px;
            overflow-y: scroll;
        }
    </style>
</head>
<body>
    <h1>Reproduction of clear() failing to trigger 'input' event</h1>
    <p>
        This page mimics a "controlled" component pattern common in frameworks like React.
        If the 'input' event is not fired when the value changes, the internal state remains 
        out of sync, and the value may be restored on blur.
    </p>

    <div class="input-container">
        <label>Input 1 (Controlled): </label>
        <input id="input1" type="text" value="">
    </div>
    <div class="input-container">
        <label>Input 2 (To trigger blur): </label>
        <input id="input2" type="text" value="">
    </div>

    <h3>Event Log:</h3>
    <div id="log"></div>

    <script>
        const logEl = document.getElementById('log');
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logEl.textContent += `[${time}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        const input1 = document.getElementById('input1');
        let internalState = '';

        // Frameworks like React rely on 'input' event (mapped to onChange)
        input1.addEventListener('input', (e) => {
            log(`EVENT: 'input' - new value: "${e.target.value}"`);
            internalState = e.target.value;
        });

        // Native 'change' event fires on blur if value changed
        input1.addEventListener('change', (e) => {
            log(`EVENT: 'change' - value: "${e.target.value}"`);
        });

        input1.addEventListener('blur', (e) => {
            log(`EVENT: 'blur'   - internalState: "${internalState}", actualValue: "${input1.value}"`);
            // Mimic framework re-enforcing state because it doesn't know it changed
            if (input1.value !== internalState) {
                log(`ACTION: Restoring value to "${internalState}" because state is out of sync!`);
                input1.value = internalState;
            }
        });

        input1.addEventListener('focus', () => {
            log(`EVENT: 'focus'  - value: "${input1.value}"`);
        });
    </script>
</body>
</html>
